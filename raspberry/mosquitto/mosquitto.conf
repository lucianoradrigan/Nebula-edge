# Broker MQTT de NebulaEdge. Lo hospeda el servidor, en su propio contenedor.
#
# POR QUE UN CONTENEDOR Y NO EMBEBIDO EN EL PROCESO DEL SERVIDOR
#   Estuvo embebido (amqtt, en el mismo event loop) y funcionaba, con un
#   rendimiento indistinguible de este -medido: p50 2,0 ms contra 1,8, y el
#   mismo retraso de event loop con 30 devices-. Se separo por tres razones que
#   no son rendimiento:
#
#     1. Aislamiento. amqtt encola sin tope bajo saturacion, y embebido esa
#        memoria es la del proceso que corre el descubrimiento BLE, las
#        sesiones y la base. Un broker desmadrado se llevaba puestos los tres
#        protocolos que no dependen de el.
#     2. Diagnostico. mosquitto registra cada conexion, desconexion y
#        suscripcion. El bug de la suscripcion que no se restauraba al
#        reconectar costo un barrido completo de pruebas y analisis de dos
#        logs; el log de este broker lo habria dicho de inmediato. Y
#        mosquitto_sub deja mirar el trafico de los devices sin pasar por el
#        servidor.
#     3. Ciclos de vida. Embebido, el broker moria en CADA reinicio del
#        servidor, que es justo lo que destapo ese bug. Aca sobrevive: los
#        devices no se desconectan y la config retenida sigue ahi.

listener 1883 0.0.0.0

# Los devices no se autentican. Era asi tambien con el broker embebido, no es
# una regresion, pero es una limitacion conocida: cualquiera en la red local
# puede publicar y suscribirse. Por eso el servidor acota sus colas por device
# (ver _QUEUE_MAX en mqtt_client.py), que es lo que impide que un publicador
# ajeno le haga crecer la memoria sin limite.
allow_anonymous true

# Persistencia: hace que los mensajes RETENIDOS sobrevivan un reinicio del
# broker. Importa porque la configuracion se publica retenida (ver
# mqtt_publish en mqtt_client.py): sin esto, reiniciar el broker dejaria a un
# device que se reconecta sin config que leer hasta el siguiente empujon.
persistence true
persistence_location /mosquitto/data/

# Tope de cola por cliente para QoS > 0. Es el valor por defecto y se deja
# explicito: a diferencia del broker embebido, que encolaba sin limite, aca
# descartar es una decision tomada y no una sorpresa.
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# Las dos que de verdad sirven para diagnosticar: sin ellas no se puede
# distinguir "el device no publico" de "el device no estaba suscrito".
log_type subscribe
log_type unsubscribe
